services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: blocwerk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: blocwerk_dev
    ports:
      - "5051:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Not for a public endpoint: DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS drops the
  # login token and OTLP auth so it "just works" on the internal network. Data is kept
  # in-memory (a rolling window), so it survives for ad-hoc debugging but not restarts.
  otel-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"   # web UI — open http://localhost:18888
      - "18889:18889"   # OTLP/gRPC ingest
    restart: unless-stopped

  blocwerk:
    image: ghcr.io/zannagh/blocwerk:latest
    ports:
      - "5050:5050"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-dashboard:18889"
      OTEL_SERVICE_NAME: Blocwerk
      POSTGRES__HOST: postgres
      POSTGRES__PORT: "5432"
      POSTGRES__DATABASE: blocwerk
      POSTGRES__USERNAME: postgres
      POSTGRES__PASSWORD: blocwerk_dev
      # Beta clips live on disk (not the database); this is where they land inside the container.
      BETAVIDEO__STORAGEPATH: /data/beta-videos
      # Outgoing SMTP mail. Empty by default => email features are disabled. Fill these (ideally via
      # docker/.env, e.g. ${SMTP__HOST}) to enable. Security: StartTls | ForceTls | Off.
      # Do NOT hardcode real credentials here.
      # SMTP__HOST: ""
      # SMTP__PORT: "587"
      # SMTP__USERNAME: ""
      # SMTP__PASSWORD: ""
      # SMTP__FROM: ""
      # SMTP__FROMNAME: "Blocwerk"
      # SMTP__SECURITY: "StartTls"
    volumes:
      - ./appsettings.json:/app/appsettings.json:ro
      # Persist the DataProtection key ring across redeploys (see AuthenticationServices.cs) so a
      # deploy no longer logs everyone out / breaks in-flight logins.
      - ./dpkeys:/app/keys
      # Beta video clips, kept out of the image so they survive redeploys.
      - ./beta-videos:/data/beta-videos
    depends_on:
      - postgres
      - otel-dashboard
    restart: unless-stopped

  # Receives the GitHub releases/packages webhook and, on a new published image, pulls and
  # recreates the blocwerk service. See docker/deploy-hook/ (and .env.example for required vars).
  # SECURITY: this drives the host docker daemon via the mounted socket, so it is effectively
  # root on the host. It only acts on webhooks whose HMAC matches WEBHOOK_SECRET — keep that secret
  # strong and never expose /hooks/deploy publicly without it.
  deploy-hook:
    build:
      context: ./deploy-hook
    image: blocwerk-deploy-hook:local
    ports:
      - "${DEPLOY_HOOK_PORT:-9000}:9000"
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in docker/.env and in the GitHub webhook}
      COMPOSE_DIR: ${COMPOSE_DIR:?set COMPOSE_DIR in docker/.env to this dir's absolute host path}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-blocwerk}
      DEPLOY_SERVICE: blocwerk
      # GHCR login for the (private) package. The host's own login lives in the macOS keychain and
      # can't be reused inside this Linux container, so give it a read:packages token. Leave empty
      # if you make the package public.
      GHCR_USER: ${GHCR_USER:-zannagh}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
    volumes:
      # Drive the host docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same-path mount so `docker compose` inside resolves the stack's relative bind mounts to the
      # identical host paths the daemon expects.
      - ${COMPOSE_DIR}:${COMPOSE_DIR}
    restart: unless-stopped
