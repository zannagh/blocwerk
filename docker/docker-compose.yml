services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: blocwerk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: blocwerk_dev
    ports:
      - "5051:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Not for a public endpoint: DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS drops the
  # login token and OTLP auth so it "just works" on the internal network. Data is kept
  # in-memory (a rolling window), so it survives for ad-hoc debugging but not restarts.
  otel-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"   # web UI — open http://localhost:18888
      - "18889:18889"   # OTLP/gRPC ingest
    restart: unless-stopped

  blocwerk:
    image: ghcr.io/zannagh/blocwerk:latest
    ports:
      - "5050:5050"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-dashboard:18889"
      OTEL_SERVICE_NAME: Blocwerk
      POSTGRES__HOST: postgres
      POSTGRES__PORT: "5432"
      POSTGRES__DATABASE: blocwerk
      POSTGRES__USERNAME: postgres
      POSTGRES__PASSWORD: blocwerk_dev
      # Beta clips live on disk (not the database); this is where they land inside the container.
      BETAVIDEO__STORAGEPATH: /data/beta-videos
      # Wall gallery uploads AND the derived image-variant cache (see IImageVariantCache). This has
      # to point at a mounted volume: the default is a relative path, which lands in the container's
      # writable layer, grows unbounded and is thrown away on every redeploy. Nothing here is
      # authoritative — the variants are regenerated from the stored originals on demand — but
      # losing it costs a re-render of every photo somebody looks at.
      # NOTE: this env var only takes effect while appsettings.json has no Blocwerk:WallImage
      # section. If you add one there it wins (see BlocwerkSettings), and the mount below is dead.
      WALLIMAGE__STORAGEPATH: /data/wall-images
      # Outgoing SMTP mail. Empty by default => email features are disabled. Fill these (ideally via
      # docker/.env, e.g. ${SMTP__HOST}) to enable. Security: StartTls | ForceTls | Off.
      # Do NOT hardcode real credentials here.
      # SMTP__HOST: ""
      # SMTP__PORT: "587"
      # SMTP__USERNAME: ""
      # SMTP__PASSWORD: ""
      # SMTP__FROM: ""
      # SMTP__FROMNAME: "Blocwerk"
      # SMTP__SECURITY: "StartTls"
      # Web Push (PWA notifications). Empty by default => push cleanly no-ops (feature dormant).
      # Set these via the deploy .env (e.g. ${VAPID__PUBLICKEY}). Env vars override appsettings here
      # (AddEnvironmentVariables() runs last), and the Vapid section is intentionally absent from
      # appsettings so these env keys are the authoritative source. Mint a keypair with WebPush's
      # VapidHelper.
      # Do NOT hardcode the private key here.
      VAPID__SUBJECT: ${VAPID__SUBJECT:-}
      VAPID__PUBLICKEY: ${VAPID__PUBLICKEY:-}
      VAPID__PRIVATEKEY: ${VAPID__PRIVATEKEY:-}
      # Deploy notices fire only on a genuine new build (MVID vs a persisted marker), so a crash/reboot
      # restart is silent. Routine deploys ping site admins only. Set this to "true" ONLY for a genuine
      # maintenance/downtime deploy, so ALL subscribed users get an "app is back online" push instead;
      # clear it again afterward. Alternative without editing env: `touch dpkeys/maintenance-window`
      # before the deploy — that one-shot marker triggers the all-users broadcast once and self-deletes.
      DEPLOY__MAINTENANCEWINDOW: ${DEPLOY__MAINTENANCEWINDOW:-}
      # Wall-geometry compute service (3D wall solve + per-facet textures), reached over the internal
      # compose network only. Speaks the compute job protocol in docker/compute-jobs-protocol.md.
      # OPT-IN: empty GEOMETRYSERVICE_URL (the default) = the feature is off and the wall-capture UI
      # hides itself, so a deploy without the compute services starts normally. To enable, set in
      # docker/.env: COMPOSE_PROFILES=compute, GEOMETRYSERVICE_URL=http://wall-geometry:8000 and
      # COMPUTE_API_KEY (the same key the wall-geometry service below reads). Do NOT hardcode it here.
      # The app polls job status and asks for no progress callbacks, so it takes no callback secret.
      # A URL must be https:// unless the host is localhost or a single-label internal name (like
      # wall-geometry) — anything else is refused.
      GEOMETRYSERVICE__URL: ${GEOMETRYSERVICE_URL:-}
      GEOMETRYSERVICE__APIKEY: ${COMPUTE_API_KEY:-}
      # Splat worker (photos -> Gaussian splat, docker/splat-worker/). Needs a GPU, so it usually runs on
      # ANOTHER machine (e.g. the owner's Mac via run-native.sh, behind HTTPS): set SPLATSERVICE_URL in
      # docker/.env to its https:// base URL. On a Linux GPU host running this whole stack, start the
      # `gpu` profile below and use http://splat-worker:8100. Empty URL = feature off.
      # SPLAT_API_KEY must equal the worker's COMPUTE_API_KEY. Do NOT hardcode either value here.
      SPLATSERVICE__URL: ${SPLATSERVICE_URL:-}
      SPLATSERVICE__APIKEY: ${SPLAT_API_KEY:-}
      # Training steps per photo-real job; empty = the worker's default (15000, ~50 min on an M4).
      SPLATSERVICE__MAXSTEPS: ${SPLAT_MAX_STEPS:-}
      # Largest walk-along capture video the app accepts, in MB (1-16384; default 2048). A reverse proxy
      # in front of the app must allow a request body this big on /api/captures/*/video.
      CAPTURE__MAXVIDEOMB: ${CAPTURE__MAXVIDEOMB:-2048}
      # Capture quality knobs; empty = the built-in default (docs: WallCapturePipelineOptions). Largest photo
      # in MB (1-200; default 40, also checked after HEIC -> JPEG), the HEIC -> JPEG quality (50-100; 92), video
      # frames (MAXVIDEOFRAMES 3-400; 120, VIDEOFRAMESPERSECOND 0.1-10; 2.5), candidates per kept frame
      # (FRAMESHARPNESSWINDOW 1-10; 3), the frames' ffmpeg -q:v (FRAMEJPEGQ 2-31, lower = better; 3) and the
      # long edge the sharpness is scored at (SHARPNESSEDGE 120-1920; 480).
      CAPTURE__MAXPHOTOMB: ${CAPTURE__MAXPHOTOMB:-}
      CAPTURE__HEICJPEGQUALITY: ${CAPTURE__HEICJPEGQUALITY:-}
      CAPTURE__MAXVIDEOFRAMES: ${CAPTURE__MAXVIDEOFRAMES:-}
      CAPTURE__VIDEOFRAMESPERSECOND: ${CAPTURE__VIDEOFRAMESPERSECOND:-}
      CAPTURE__FRAMESHARPNESSWINDOW: ${CAPTURE__FRAMESHARPNESSWINDOW:-}
      CAPTURE__FRAMEJPEGQ: ${CAPTURE__FRAMEJPEGQ:-}
      CAPTURE__SHARPNESSEDGE: ${CAPTURE__SHARPNESSEDGE:-}
      # Texture options sent to wall-geometry (docker/wall-geometry/README.md); empty = not sent, the
      # service's defaults apply (2 mm/px, 4096 px, JPEG 90). MMPERPX 0.25-50, MAXSIDEPX 256-8192,
      # JPEGQUALITY 30-100. A finer texture needs TEXTURES_BLEND_MAX_BYTES / TEXTURES_MAX_MEGAPIXELS raised.
      GEOMETRYSERVICE__TEXTURES__MMPERPX: ${GEOMETRYSERVICE__TEXTURES__MMPERPX:-}
      GEOMETRYSERVICE__TEXTURES__MAXSIDEPX: ${GEOMETRYSERVICE__TEXTURES__MAXSIDEPX:-}
      GEOMETRYSERVICE__TEXTURES__JPEGQUALITY: ${GEOMETRYSERVICE__TEXTURES__JPEGQUALITY:-}
    volumes:
      - ./appsettings.json:/app/appsettings.json:ro
      # Persist the DataProtection key ring across redeploys (see AuthenticationServices.cs) so a
      # deploy no longer logs everyone out / breaks in-flight logins.
      - ./dpkeys:/app/keys
      # Beta video clips, kept out of the image so they survive redeploys.
      - ./beta-videos:/data/beta-videos
      # Wall gallery uploads + the image-variant cache (WALLIMAGE__STORAGEPATH above).
      - ./wall-images:/data/wall-images
    depends_on:
      - postgres
      - otel-dashboard
    restart: unless-stopped

  # Wall-geometry service (docker/wall-geometry/): marker observations -> metric 3D wall geometry, and
  # photos + geometry -> per-facet orthophoto textures. Heavy CPU work runs HERE, never on the user's
  # device. Internal only: no published port; the app reaches it at http://wall-geometry:8000.
  # Profile `compute`: NOT started by a plain `docker compose up`; enable it with COMPOSE_PROFILES=compute
  # in docker/.env (or `docker compose --profile compute up -d`) and set GEOMETRYSERVICE_URL for the app.
  # The app does not depend_on it: the site must keep working when this experimental service is down.
  # Single instance by design (in-memory job queue, results expire after RESULT_TTL_S).
  # Built by .github/workflows/wall-geometry.yml. Production runs a STANDALONE copy of this compose
  # file: adding this service there is a manual step (docker/wall-geometry/README.md, "Production").
  wall-geometry:
    image: ghcr.io/zannagh/blocwerk-geometry:latest
    profiles: ["compute"]
    environment:
      # REQUIRED bearer key on every endpoint except /health: the service refuses to listen on 0.0.0.0
      # without one (computejobs.serve exits 2), so it never runs unauthenticated. Other containers on
      # this compose network could otherwise submit jobs. Set it in docker/.env; never commit the value.
      # Not `:?` on purpose: compose interpolates EVERY service, even ones behind an inactive profile,
      # so a required variable here would stop deploys that don't use the compute services at all.
      COMPUTE_API_KEY: ${COMPUTE_API_KEY:-}
      # HMAC key for signed progress callbacks (X-Blocwerk-Signature). Empty => no callbacks, the app polls.
      COMPUTE_CALLBACK_SECRET: ${COMPUTE_CALLBACK_SECRET:-}
      # Callbacks may only go to public addresses, plus these hosts on the private compose network.
      CALLBACK_ALLOWED_HOSTS: blocwerk
      RESULT_TTL_S: "3600"
      # Limits (docker/wall-geometry/README.md); empty = the default. A textures request carries every photo:
      # 50+ full-size 48 MP photos (12-22 MB each) need GEOMETRY_MAX_REQUEST_MB well above the default 400.
      MAX_REQUEST_MB: ${GEOMETRY_MAX_REQUEST_MB:-}
      TEXTURES_TIMEOUT_S: ${TEXTURES_TIMEOUT_S:-}
      TEXTURES_MAX_MEGAPIXELS: ${TEXTURES_MAX_MEGAPIXELS:-}
      TEXTURES_BLEND_MAX_BYTES: ${TEXTURES_BLEND_MAX_BYTES:-}
      # solve-sfm (markerless captures): splat-prepare's sparse.zip cap (default 256 MB; The Attic's 353 images:
      # 37 MB) and the job timeout (default 900 s; The Attic: ~25 s).
      SFM_MAX_SPARSE_MB: ${SFM_MAX_SPARSE_MB:-}
      SFM_TIMEOUT_S: ${SFM_TIMEOUT_S:-}
    # Job inputs/outputs live in the container's /tmp (writable layer, not RAM) and are deleted
    # RESULT_TTL_S after each job finishes; nothing there is authoritative, so no volume.
    restart: unless-stopped

  # Splat worker (docker/splat-worker/): wall photos -> Gaussian splat (COLMAP + Brush on Vulkan).
  # Profile `gpu`: NOT started by a plain `docker compose up` (the production box has no GPU); on a
  # Linux NVIDIA host with the NVIDIA container toolkit: `docker compose --profile gpu up -d splat-worker`.
  # (AMD/Intel: replace the `deploy` block with `devices: ["/dev/dri:/dev/dri"]`.) Docker on macOS has
  # no GPU: on a Mac run docker/splat-worker/run-native.sh instead. Internal only: no published port.
  # linux/amd64 image, built by .github/workflows/splat-worker.yml.
  splat-worker:
    image: ghcr.io/zannagh/blocwerk-splat-worker:latest
    profiles: ["gpu"]
    environment:
      # Required: the worker refuses to listen on 0.0.0.0 without it. Set it in docker/.env.
      # Not `:?` on purpose: compose interpolates EVERY service, even ones behind a profile, so a required
      # variable here would force GPU-less boxes (which never start this worker) to invent a dummy key.
      # The worker itself refuses to bind beyond localhost without a key, so an empty value fails safe.
      COMPUTE_API_KEY: ${SPLAT_API_KEY:-}
      COMPUTE_CALLBACK_SECRET: ${SPLAT_CALLBACK_SECRET:-}
      CALLBACK_ALLOWED_HOSTS: blocwerk
      RESULT_TTL_S: "3600"
      SPLAT_TIMEOUT_S: "14400"
      # Memory (docker/splat-worker/README.md): each job sizes its budget from the container's memory
      # (cgroup limit / MemAvailable) and fits COLMAP to it; SPLAT_MAX_MEMORY_MB (0 = unset) is a hard
      # upper bound on that budget. COLMAP's SIFT size / features / matches / threads are upper bounds.
      SPLAT_MAX_MEMORY_MB: ${SPLAT_MAX_MEMORY_MB:-0}
      SPLAT_MAX_SWAP_GROWTH_MB: ${SPLAT_MAX_SWAP_GROWTH_MB:-2048}
      COLMAP_MAX_IMAGE_SIZE: ${COLMAP_MAX_IMAGE_SIZE:-2400}
      COLMAP_MAX_FEATURES: ${COLMAP_MAX_FEATURES:-8192}
      COLMAP_MAX_MATCHES: ${COLMAP_MAX_MATCHES:-8192}
      COLMAP_THREADS: ${COLMAP_THREADS:-4}
      # Domain-size pooling / affine-covariant SIFT (CPU extraction; 1 = on, the tested default).
      COLMAP_DSP_SIFT: ${COLMAP_DSP_SIFT:-1}
      COLMAP_AFFINE_SHAPE: ${COLMAP_AFFINE_SHAPE:-1}
      # JPEG quality of the metadata-free arrival copy (95) and of the training images (92); empty = default.
      INGEST_JPEG_QUALITY: ${INGEST_JPEG_QUALITY:-}
      FRAME_JPEG_QUALITY: ${FRAME_JPEG_QUALITY:-}
    volumes:
      # Brush's GPU autotune cache survives restarts (job files are deleted after RESULT_TTL_S anyway).
      - splat-cache:/var/lib/splat-worker/brush-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # The same worker for NVIDIA hosts, training with gsplat (CUDA) instead of Brush: Linux, and Windows
  # through Docker Desktop's WSL2 backend (where Brush has no working NVIDIA path). Profile `gpu-cuda`:
  # `docker compose --profile gpu-cuda up -d --build splat-worker-cuda`, then point the app at
  # SPLATSERVICE_URL=http://splat-worker-cuda:8100. Built locally from Dockerfile.cuda (not published).
  # Needs the NVIDIA container toolkit (Docker Desktop brings it on Windows). Run it OR `splat-worker`.
  splat-worker-cuda:
    build:
      context: ..
      dockerfile: docker/splat-worker/Dockerfile.cuda
    image: blocwerk-splat-worker-cuda:local
    profiles: ["gpu-cuda"]
    environment:
      # Same key / callback / limit pattern as splat-worker above (and the same reasons for no `:?`).
      COMPUTE_API_KEY: ${SPLAT_API_KEY:-}
      COMPUTE_CALLBACK_SECRET: ${SPLAT_CALLBACK_SECRET:-}
      CALLBACK_ALLOWED_HOSTS: blocwerk
      RESULT_TTL_S: "3600"
      SPLAT_TIMEOUT_S: "14400"
      SPLAT_TRAINER: gsplat
      # e.g. `ultra` to train every request at ultra (>= 12 GB VRAM, else max); empty = what the app asks.
      SPLAT_PROFILE_OVERRIDE: ${SPLAT_PROFILE_OVERRIDE:-}
      # 0 = read the free VRAM with nvidia-smi; set it to leave room for something else on the GPU.
      SPLAT_VRAM_MB: ${SPLAT_VRAM_MB:-0}
      SPLAT_MAX_MEMORY_MB: ${SPLAT_MAX_MEMORY_MB:-0}
      SPLAT_MAX_SWAP_GROWTH_MB: ${SPLAT_MAX_SWAP_GROWTH_MB:-2048}
      COLMAP_MAX_IMAGE_SIZE: ${COLMAP_MAX_IMAGE_SIZE:-2400}
      # COLMAP runs on the GPU here (CUDA build; docker/splat-worker/README.md "GPU SfM"). On the GPU,
      # COLMAP_MAX_MATCHES is also how many features per image are matched at all: keep it >= the features.
      COLMAP_USE_GPU: ${COLMAP_USE_GPU:-1}
      COLMAP_GPU_INDEX: ${COLMAP_GPU_INDEX:-0}
      COLMAP_MAX_FEATURES: ${COLMAP_MAX_FEATURES:-16384}
      COLMAP_MAX_MATCHES: ${COLMAP_MAX_MATCHES:-32768}
      COLMAP_THREADS: ${COLMAP_THREADS:-4}
      # 1 = DSP / affine SIFT: better features, but COLMAP extracts them on the CPU only.
      COLMAP_DSP_SIFT: ${COLMAP_DSP_SIFT:-0}
      COLMAP_AFFINE_SHAPE: ${COLMAP_AFFINE_SHAPE:-0}
      COLMAP_MAPPER: ${COLMAP_MAPPER:-incremental}
      # > 0: vocabulary-tree loop closure for video frames (the tree is baked into the image).
      COLMAP_VOCAB_TREE_IMAGES: ${COLMAP_VOCAB_TREE_IMAGES:-0}
      # > 0: hold out every Nth view and report stats.evalPsnr / evalSsim (a measurement; those views don't train).
      GSPLAT_EVAL_EVERY: ${GSPLAT_EVAL_EVERY:-0}
      # 1 = the wall-zone recipe for every job with a wall geometry (README "Wall zones"); 0 = plain gsplat.
      SPLAT_WALL_ZONES: ${SPLAT_WALL_ZONES:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # The splat worker's CPU half for 3D runners (docs/marker-walls.md "3D runners"): splat-prepare (COLMAP,
  # the training bundle) and splat-finish (alignment, the crop box or the opt-in wall-zone cut, clean-up,
  # export), no GPU and no trainer (SPLAT_WORKER_MODE=cpu refuses the all-in-one `splat` kind). The training
  # runs on the runners: set RUNNERS_MODE=always and SPLATSERVICE_URL=http://splat-cpu:8100. Profile
  # `compute`. Internal only.
  splat-cpu:
    image: ghcr.io/zannagh/blocwerk-splat-worker:latest
    profiles: ["compute"]
    environment:
      COMPUTE_API_KEY: ${SPLAT_API_KEY:-}
      COMPUTE_CALLBACK_SECRET: ${SPLAT_CALLBACK_SECRET:-}
      CALLBACK_ALLOWED_HOSTS: blocwerk
      SPLAT_WORKER_MODE: cpu
      RESULT_TTL_S: "3600"
      SPLAT_TIMEOUT_S: "14400"
      SPLAT_MAX_MEMORY_MB: ${SPLAT_MAX_MEMORY_MB:-0}
      SPLAT_MAX_SWAP_GROWTH_MB: ${SPLAT_MAX_SWAP_GROWTH_MB:-2048}
      COLMAP_MAX_IMAGE_SIZE: ${COLMAP_MAX_IMAGE_SIZE:-2400}
      COLMAP_MAX_FEATURES: ${COLMAP_MAX_FEATURES:-8192}
      COLMAP_MAX_MATCHES: ${COLMAP_MAX_MATCHES:-8192}
      COLMAP_THREADS: ${COLMAP_THREADS:-4}
    restart: unless-stopped

  # A 3D runner on THIS host's NVIDIA GPU (the CUDA image; it pulls jobs from the app like any runner, so
  # SERVER is the app's public https URL). The key comes from runner.env next to this file (one line
  # BWR_KEY=bwr_..., created in the wall's 3D runners settings); never put it into .env or here.
  # `docker compose --profile gpu-runner up -d gpu-runner`. No ports.
  gpu-runner:
    image: blocwerk-splat-worker-cuda:local
    profiles: ["gpu-runner"]
    command: ["python", "-m", "splatworker.gpurunner", "--server", "${RUNNER_SERVER_URL:-https://blocwerk.app}"]
    env_file:
      - path: runner.env
        required: false
    environment:
      SPLAT_VRAM_MB: ${SPLAT_VRAM_MB:-0}
      RUNNER_MAX_QUALITY: ${RUNNER_MAX_QUALITY:-}
      # 1 = apply a bundle's zones.json even when the job did not opt in; 0 = plain unless it did.
      SPLAT_WALL_ZONES: ${SPLAT_WALL_ZONES:-0}
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Receives the GitHub releases/packages webhook and, on a new published image, pulls and
  # recreates the blocwerk service. See docker/deploy-hook/ (and .env.example for required vars).
  # SECURITY: this drives the host docker daemon via the mounted socket, so it is effectively
  # root on the host. It only acts on webhooks whose HMAC matches WEBHOOK_SECRET — keep that secret
  # strong and never expose /hooks/deploy publicly without it.
  deploy-hook:
    build:
      context: ./deploy-hook
    image: blocwerk-deploy-hook:local
    ports:
      - "${DEPLOY_HOOK_PORT:-9000}:9000"
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in docker/.env and in the GitHub webhook}
      COMPOSE_DIR: ${COMPOSE_DIR:?set COMPOSE_DIR in docker/.env to this dir's absolute host path}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-blocwerk}
      DEPLOY_SERVICE: blocwerk
      # GHCR login for the (private) package. The host's own login lives in the macOS keychain and
      # can't be reused inside this Linux container, so give it a read:packages token. Leave empty
      # if you make the package public.
      GHCR_USER: ${GHCR_USER:-zannagh}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      # Installation-scoped API key (bwk_…) used only to announce "the server is updating" to the
      # still-live container just before it is recreated. Optional: unset simply skips the notice.
      # Mint it on /administration; never commit the value.
      BLOCWERK_DEPLOY_API_KEY: ${BLOCWERK_DEPLOY_API_KEY:-}
      # Where to post that announcement. Must be the CURRENT domain — a redirecting host drops the
      # Authorization header.
      ANNOUNCE_URL: ${ANNOUNCE_URL:-https://blocwerk.app/api/v1/maintenance/announce}
      # How long the notice survives if the deploy never finishes, and how long the hook pauses
      # after announcing so the notice reaches the circuits. These MUST be passed through: the
      # operator sets them in the deploy host's .env, and without them here run-deploy.sh only ever
      # sees its own built-in defaults. An ETA shorter than the deploy is the failure that matters —
      # the notice expires mid-deploy and the pill drops back to "Session ended".
      ANNOUNCE_ETA: ${ANNOUNCE_ETA:-600}
      ANNOUNCE_GRACE: ${ANNOUNCE_GRACE:-5}
      # The busy gate the hook polls before any of this. Same domain as ANNOUNCE_URL on purpose:
      # the two disagreeing about which host is production is how the announcement ends up aimed at
      # a redirector that strips its bearer token.
      HEALTH_URL: ${HEALTH_URL:-https://blocwerk.app/health/ready-to-deploy}
    volumes:
      # Drive the host docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same-path mount so `docker compose` inside resolves the stack's relative bind mounts to the
      # identical host paths the daemon expects.
      - ${COMPOSE_DIR}:${COMPOSE_DIR}
    restart: unless-stopped

volumes:
  splat-cache:
