{{- $ing := .Values.web.ingress -}}
{{- if $ing.enabled -}}
{{- $ctx := dict "root" . "component" "web" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "blocwerk.fullname" . }}
  labels:
    {{- include "blocwerk.labels" $ctx | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "blocwerk.fullname" . }}
                port:
                  name: http
  {{- with $ing.tlsSecretName }}
  tls:
    - hosts: [{{ $ing.host | quote }}]
      secretName: {{ . }}
  {{- end }}
{{- end }}
