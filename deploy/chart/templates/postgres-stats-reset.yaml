{{- $pg := .Values.postgres -}}
{{- if $pg.statsReset.enabled -}}
{{- $ctx := dict "root" . "component" "pgstats-reset" -}}
# pg_stat_statements_reset() every second day, so /administration/db-stats shows recent load (autodeploy.sh did it
# every 48 h). A failure changes nothing but the stats.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "blocwerk.fullname" . }}-pgstats-reset
  labels:
    {{- include "blocwerk.labels" $ctx | nindent 4 }}
spec:
  schedule: {{ $pg.statsReset.schedule | quote }}
  timeZone: {{ $pg.statsReset.timeZone }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            {{- include "blocwerk.selectorLabels" $ctx | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- include "blocwerk.podOptions" . | nindent 10 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: psql
              image: {{ include "blocwerk.image" (list $pg.image "") }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  # A new pod is refused for its first seconds, until the k3s NetworkPolicy controller has added its
                  # address (2026-10-29 04:30: both attempts failed with "Connection refused" against a Postgres that
                  # had been up for 35 h): wait up to 60 s.
                  i=0; until pg_isready -h {{ include "blocwerk.postgresHost" . }} -p {{ include "blocwerk.postgresPort" . }} -U {{ $pg.username }} -d {{ $pg.database }} -q; do
                    i=$((i+1)); [ "$i" -lt 30 ] || { echo "{{ include "blocwerk.postgresHost" . }} not reachable after 60 s"; exit 1; }; sleep 2
                  done
                  psql -h {{ include "blocwerk.postgresHost" . }} -p {{ include "blocwerk.postgresPort" . }} -U {{ $pg.username }} -d {{ $pg.database }} --no-psqlrc --quiet -c 'select pg_stat_statements_reset()'
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: {{ .Values.secrets.postgres }}, key: POSTGRES_PASSWORD}
              resources:
                requests: {memory: 16Mi}
                limits: {memory: 128Mi}
              securityContext:
                {{- include "blocwerk.restrictedContainer" true | nindent 16 }}
{{- end }}
