{{- if .Values.deployGate.enabled -}}
{{- $name := printf "%s-deploy-gate" (include "blocwerk.fullname" .) -}}
{{- $ctx := dict "root" . "component" "deploy-gate" -}}
{{- $hook := dict "phase" "PreSync" "wave" -1 -}}
# The gate scripts, and read access to this namespace's pods (the running rollout fingerprints). Nothing else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "blocwerk.labels" $ctx | nindent 4 }}
  annotations:
    {{- include "blocwerk.hookAnnotations" $hook | nindent 4 }}
data:
  gate-lib.sh: |
    {{- .Files.Get "files/gate-lib.sh" | nindent 4 }}
  deploy-gate.sh: |
    {{- .Files.Get "files/deploy-gate.sh" | nindent 4 }}
  compute-gate.sh: |
    {{- .Files.Get "files/compute-gate.sh" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "blocwerk.labels" $ctx | nindent 4 }}
  annotations:
    {{- include "blocwerk.hookAnnotations" $hook | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "blocwerk.labels" $ctx | nindent 4 }}
  annotations:
    {{- include "blocwerk.hookAnnotations" $hook | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "blocwerk.labels" $ctx | nindent 4 }}
  annotations:
    {{- include "blocwerk.hookAnnotations" $hook | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
