<!DOCTYPE html>
<!-- The offline client's shell (plan 2026-10-22 §1). Only blazor.webassembly.js is named here; it reads the boot
     manifest, which names the fingerprinted runtime and assemblies. The shared library's files sit at /_content/,
     outside the /v/ base, hence "../". The `offline` partition meta tells the shared cache modules this page is no
     server identity. It loads no blazor.web.js and no edit-presence.js, so it holds no circuit and no edit lease. -->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="bw-partition" content="offline" />
    <meta name="color-scheme" content="light dark" />
    <title>Blocwerk · offline</title>
    <base href="/v/" />
    <link rel="stylesheet" href="css/client.css" />
    <link rel="stylesheet" href="../_content/Blocwerk.Shared.Ui/css/hold-tap.css" />
</head>
<body>
    <div id="app"><p class="bw-client-loading">Opening the offline view…</p></div>
    <!-- The device cache's shared modules (Blocwerk.Shared.Ui, PR 3.7). Loading them only defines their globals; the
         client store (PR 3.10) starts them. -->
    <script src="../_content/Blocwerk.Shared.Ui/js/asset-ledger-idb.js"></script>
    <script src="../_content/Blocwerk.Shared.Ui/js/asset-ledger.js"></script>
    <script src="../_content/Blocwerk.Shared.Ui/js/asset-wipe.js"></script>
    <script src="../_content/Blocwerk.Shared.Ui/js/asset-lock.js"></script>
    <script src="../_content/Blocwerk.Shared.Ui/js/asset-session.js"></script>
    <script src="../_content/Blocwerk.Shared.Ui/js/asset-clear.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
