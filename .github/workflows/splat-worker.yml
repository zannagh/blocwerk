name: Splat worker

# Builds, tests and publishes ghcr.io/<owner>/blocwerk-splat-worker (docker/splat-worker/), the Linux
# (Vulkan GPU) image of the splat worker. linux/amd64 only: Brush publishes no Linux arm64 build.
# The unit tests run in the image's `test` stage (no GPU needed); the GPU path itself is NOT exercised
# in CI (GitHub runners have no GPU), see docker/splat-worker/README.md.
# Build context = repo root (Dockerfile.dockerignore keeps it to the worker + docker/compute-jobs-py).

on:
  push:
    branches:
      - main
    paths:
      - 'docker/splat-worker/**'
      - 'docker/compute-jobs-py/**'
      - '.github/workflows/splat-worker.yml'
  pull_request:
    paths:
      - 'docker/splat-worker/**'
      - 'docker/compute-jobs-py/**'
      - '.github/workflows/splat-worker.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/blocwerk-splat-worker
  CONTEXT: .
  DOCKERFILE: docker/splat-worker/Dockerfile

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run the test suite in the image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          target: test
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=splat-worker
          cache-to: type=gha,mode=max,scope=splat-worker

  publish:
    name: Build & publish
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=splat-worker
          cache-to: type=gha,mode=max,scope=splat-worker
