name: Wall geometry service

# Builds, tests and publishes ghcr.io/<owner>/blocwerk-geometry (docker/wall-geometry/).
# Independent of the app image (main.yml): it only runs when the service's own files (or the shared
# protocol package docker/compute-jobs-py/) change. Build context = repo root (Dockerfile.dockerignore
# next to the Dockerfile keeps it to the service + the shared package).

on:
  push:
    branches:
      - main
    paths:
      - 'docker/wall-geometry/**'
      - 'docker/compute-jobs-py/**'
      - '.github/workflows/wall-geometry.yml'
  pull_request:
    paths:
      - 'docker/wall-geometry/**'
      - 'docker/compute-jobs-py/**'
      - '.github/workflows/wall-geometry.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/blocwerk-geometry
  CONTEXT: .
  DOCKERFILE: docker/wall-geometry/Dockerfile

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile's `test` stage installs the pinned deps + pytest and runs the whole suite
      # (including the capture-1 solve), so CI tests exactly what the runtime image contains.
      - name: Run the test suite in the image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          target: test
          push: false
          cache-from: type=gha,scope=wall-geometry
          cache-to: type=gha,mode=max,scope=wall-geometry

  publish:
    name: Build & publish
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wall-geometry
          cache-to: type=gha,mode=max,scope=wall-geometry
